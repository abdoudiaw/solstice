# State model, encode-process-decode GNN with latent mesh (docs/specs/gnn_roadmap.md).
task: state
model:
  class: gnn_encproc
  config:
    node_features: 2
    param_dim: 5
    out_features: 4
    hidden: 128
    n_process_layers: 8
graph:
  n_latent: 256           # solstice.graphs.build_latent_graph
  k_nn: 6
variables:
  inputs: [ptot, core_fueling, puff_D2, dna, chi]
  outputs: [te, ti, ne, ua_D1]
